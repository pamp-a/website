<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>pamp.a | architecture</title>
  <meta name="description" content="pamp.a, agence d'architecture à paris et lausanne. contact@pampatelier.eu">
  <meta name="theme-color" content="#070707">

  <style>
    :root {
      --background: #070707;

      --yellow: #f5d13f;
      --red: #f05a48;
      --blue: #6687ef;
      --green: #49bb7c;
      --pink: #ed92bc;
      --orange: #864c1a;
      --white: #e8e5de;

      --card-width: auto;
      --speed: 70;

      --font: "Helvetica Neue", "Neue Haas Grotesk Text Pro",
              "Inter", Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      --color: var(--yellow);

      background: var(--background);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;

      transition: background-color .5s cubic-bezier(.22,1,.36,1);
    }

    body.filled {
      background: var(--color);
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    #card {
      position: absolute;

      width: min(var(--card-width), calc(100vw - 28px));
      padding: 0px;

      color: var(--color);
      border: 0px solid currentColor;
      background: transparent;

      text-decoration: none;
      cursor: pointer;
      user-select: none;

      will-change: transform;

      transition:
        color .5s cubic-bezier(.22,1,.36,1),
        background-color .2s ease;
    }

    body.filled #card {
      color: var(--background);
    }

    /* =========================================================
       TYPOGRAPHY

       Every line is automatically stretched to exactly the same
       visual width.

       JS adjusts font-size + letter-spacing while keeping the
       values inside these tasteful limits.
       ========================================================= */

    .fit {
      width: 100%;
      display: block;

      white-space: nowrap;
      line-height: 1;

      transform-origin: left center;
    }

    .brand {
      --ideal-size: 54px;
      --min-size: 44px;
      --max-size: 62px;
      --max-spacing: 16px;

      font-weight: 800;
    }

      .activity {
      --ideal-size: 14px;
      --min-size: 12px;
      --max-size: 17px;
      --max-spacing: 9px;
      
      text-align:justify;

      margin-top: 5px;

      font-weight: 500;
      text-transform: lowercase;
      display: flex;
      justify-content:space-between;

    }

    .cities {
      --ideal-size: 14px;
      --min-size: 12px;
      --max-size: 17px;
      --max-spacing: 9px;
      
      text-align:justify;

      margin-top: 17px;

      font-weight: 200;
      text-transform: lowercase;
      display: flex;
      justify-content:space-between;

    }

     .email {
      --ideal-size: 14px;
      --min-size: 12px;
      --max-size: 17px;
      --max-spacing: 9px;
      
      text-align:justify;

      margin-top: 17px;

      font-weight: 200;
      text-transform: lowercase;
      display: flex;
      justify-content:space-between;
    }

    .phone {
      --ideal-size: 13px;
      --min-size: 11px;
      --max-size: 15px;
      --max-spacing: 5px;

      margin-top: 5px;

      font-weight: 400;
      opacity: .68;
    }

    #card:hover,
    #card:focus-visible {
      background: color-mix(in srgb, currentColor 10%, transparent);
      outline: none;
    }

    @media (max-width: 500px) {
      :root {
        --card-width: 205px;
      }

      #card {
        padding: 25px;
      }

      .cities {
        margin-top: 26px;
      }

      .email {
        margin-top: 2px;
        padding-top: 2px;
      }
    }
  </style>
</head>

<body>
  <main id="stage">

    <!-- =======================================================
         EDIT ONLY THIS PART
         ======================================================= -->

    <a id="card" href="mailto:contact@pampatelier.eu">
      <div class="fit brand">pamp.a</div>
      <div class="fit activity"><span>pratique</span> <span>architecturale</span></div>
      <div class="fit cities"><span>paris</span> <span>lausanne</span></div>
      <div class="fit email"><span>contact</span>@<span>pampatlier</span>.<span>eu</span></div>
      <div class="fit phone">
    </a>

  </main>

  <script>
    const card = document.querySelector("#card");
    const stage = document.querySelector("#stage");
    const lines = document.querySelectorAll(".fit");

    const colors = [
      "--yellow",
      "--red",
      "--blue",
      "--green",
      "--pink",
      "--orange",
      "--white"
    ];

    /*
     * Premium justified typography:
     *
     * 1. Start around the preferred font size
     * 2. Increase/decrease size to approach the card width
     * 3. Distribute the remaining width as letter spacing
     *
     * Result:
     * pamp.a
     * paris lausanne
     * contact@...
     * +33 7...
     *
     * all terminate visually on the same vertical axis.
     */
    function fitTypography() {
      lines.forEach(line => {
        const style = getComputedStyle(line);
        const target = line.clientWidth;

        const ideal = parseFloat(style.getPropertyValue("--ideal-size"));
        const min = parseFloat(style.getPropertyValue("--min-size"));
        const max = parseFloat(style.getPropertyValue("--max-size"));
        const maxSpacing = parseFloat(style.getPropertyValue("--max-spacing"));

        line.style.fontSize = `${ideal}px`;
        line.style.letterSpacing = "0px";

        const width = line.scrollWidth;
        const characters = Math.max(1, line.textContent.trim().length - 1);

        let size = Math.min(max, Math.max(min, ideal * target / width));

        line.style.fontSize = `${size}px`;
        line.style.letterSpacing = "0px";

        const naturalWidth = line.scrollWidth;
        const spacing = Math.min(
          maxSpacing,
          Math.max(0, (target - naturalWidth) / characters)
        );

        line.style.letterSpacing = `${spacing}px`;

        const finalWidth = line.scrollWidth;

        if (finalWidth < target) {
          const scale = Math.min(1.04, target / finalWidth);
          line.style.transform = `scaleX(${scale})`;
        } else {
          line.style.transform = "";
        }
      });
    }

    const speed = Number(
      getComputedStyle(document.documentElement)
        .getPropertyValue("--speed")
    );

    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let x = 0;
    let y = 0;

    let dx = Math.random() > .5 ? 1 : -1;
    let dy = Math.random() > .5 ? 1 : -1;

    let color = 0;
    let paused = reducedMotion.matches;
    let last = performance.now();

    function bounds() {
      return {
        x: Math.max(0, stage.clientWidth - card.offsetWidth),
        y: Math.max(0, stage.clientHeight - card.offsetHeight)
      };
    }

    function changeColor() {
      color = (color + 1) % colors.length;

      document.body.style.setProperty(
        "--color",
        `var(${colors[color]})`
      );

      
    }

    function pause() {
      paused = true;
    }

    function resume() {
      if (reducedMotion.matches) return;

      paused = false;
      last = performance.now();
    }

    function animate(time) {
      if (!paused) {
        const dt = Math.min((time - last) / 1000, .03);
        const max = bounds();
        const move = speed * dt;

        let hit = false;

        x += dx * move;
        y += dy * move;

        if (x <= 0 || x >= max.x) {
          x = Math.max(0, Math.min(x, max.x));
          dx *= -1;
          hit = true;
        }

        if (y <= 0 || y >= max.y) {
          y = Math.max(0, Math.min(y, max.y));
          dy *= -1;
          hit = true;
        }

        if (hit) {
          changeColor();
        }

        card.style.transform = `translate3d(${x}px,${y}px,0)`;
      }

      last = time;
      requestAnimationFrame(animate);
    }

    function placeCard() {
      fitTypography();

      const max = bounds();

      x = Math.random() * max.x;
      y = Math.random() * max.y;

      card.style.transform = `translate3d(${x}px,${y}px,0)`;
    }

    card.addEventListener("pointerenter", pause);
    card.addEventListener("pointerleave", resume);

    card.addEventListener("focus", pause);
    card.addEventListener("blur", resume);

    addEventListener("resize", () => {
      fitTypography();

      const max = bounds();

      x = Math.min(x, max.x);
      y = Math.min(y, max.y);
    });

    document.fonts.ready.then(placeCard);

    requestAnimationFrame(animate);
  </script>
</body>
</html>
